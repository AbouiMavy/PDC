name: PDC V5-B validation (no deploy)

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        run: npm ci --prefix backend/pdc-api
      - name: Run app regression tests
        run: node --test tests/*.test.mjs
      - name: Run backend tests
        run: npm test --prefix backend/pdc-api
      - name: Build Vite frontend
        run: npm run build
      - name: Release candidate static checks
        run: node scripts/check-v5b-release-candidate.mjs
